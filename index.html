<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lattice Boltzmann wind tunnel</title>
  <link rel="stylesheet" href="/src/app.css" />
</head>
<body>
  <main id="stage">
    <canvas id="view" class="fit" aria-label="Flow field"></canvas>
    <div id="nogpu" hidden></div>
  </main>

  <button class="menu-button" type="button" aria-controls="panel" aria-expanded="false" aria-label="Open settings"><span data-icon="menu"></span></button>

  <aside id="panel" aria-label="Settings">
    <h1>Wind tunnel</h1>
    <p class="sub">D2Q9 TRT lattice Boltzmann on WebGPU</p>

    <details class="group" open>
      <summary><span data-icon="shapes"></span>Obstacle<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body">
        <label>Shape
          <select id="obstacle">
            <option value="cylinder">Cylinder</option>
            <option value="naca">NACA 0012</option>
            <option value="square">Square</option>
            <option value="plate">Flat plate</option>
            <option value="none">None (draw your own)</option>
          </select>
        </label>
        <label><span>Size <output id="sizeOut"></output> cells</span>
          <input id="size" type="range" min="8" max="400" step="1" />
        </label>
        <label><span>Angle <output id="angleOut"></output>°</span>
          <input id="angle" type="range" min="-30" max="30" step="0.5" value="0" />
        </label>
        <div class="buttons"><button id="resetBody" type="button">Reset obstacle</button></div>
      </div>
    </details>

    <details class="group" open>
      <summary><span data-icon="wind"></span>Flow<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body">
        <label>Reynolds number
          <input id="re" type="number" min="1" max="1000000" step="any" value="150" />
        </label>
        <label><span>Lattice speed u <output id="uOut"></output></span>
          <input id="u" type="range" min="0.02" max="0.1" step="0.005" value="0.1" />
        </label>
        <label class="check"><input id="smag" type="checkbox" /> <span>Smagorinsky stabilizer, C<sub>s</sub> <output id="csOut"></output></span></label>
        <input id="cs" type="range" min="0.1" max="0.17" step="0.005" value="0.14" aria-label="Smagorinsky constant" />
        <p id="tauNote" class="note"></p>
        <p id="reNote" class="note warn" hidden></p>
      </div>
    </details>

    <details class="group" open>
      <summary><span data-icon="eye"></span>View<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body">
        <label>Colour by
          <select id="viewMode">
            <option value="0">Vorticity (curl)</option>
            <option value="1">Speed</option>
            <option value="2">Density</option>
            <option value="3">Schlieren</option>
          </select>
        </label>
        <label><span>Contrast</span> <input id="contrast" type="range" min="0.2" max="5" step="0.1" value="1" /></label>
        <label>Tracers
          <select id="tracers">
            <option value="0">Off</option>
            <option value="1" selected>Wind particles</option>
            <option value="2">Streaklines</option>
          </select>
        </label>
      </div>
    </details>

    <details class="group">
      <summary><span data-icon="box"></span>Tunnel<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body">
        <label>Walls
          <select id="tunnel">
            <option value="free">Free flight (slip walls)</option>
            <option value="channel">Channel (no-slip, parabolic inlet)</option>
          </select>
        </label>
        <label>Grid
          <select id="grid">
            <option value="512x256">512 × 256</option>
            <option value="1024x512" selected>1024 × 512</option>
            <option value="2048x1024">2048 × 1024</option>
            <option value="4096x2048">4096 × 2048</option>
          </select>
        </label>
      </div>
    </details>

    <details class="group">
      <summary><span data-icon="gauge"></span>Simulation<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body">
        <label><span>Steps per frame <output id="spfOut"></output></span>
          <select id="spfMode">
            <option value="auto" selected>Auto (fit frame budget)</option>
            <option value="1">1</option>
            <option value="5">5</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
    </details>

    <details class="group">
      <summary><span data-icon="chart-line"></span>Forces<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body">
        <div class="chart">
          <canvas id="chart" aria-label="Drag and lift coefficient history"></canvas>
          <div id="chartTip" class="tip" hidden></div>
        </div>
        <p class="note">Coefficients use the reference length L and <span id="uRefNote">the inlet speed</span>.</p>
      </div>
    </details>

    <details class="group">
      <summary><span data-icon="link"></span>Pages<span class="chev" data-icon="chevron-down"></span></summary>
      <div class="group-body links">
        <a href="3d.html">3D tunnel</a>
        <a href="validate.html">Validation suite</a>
        <a href="bench.html">MLUPS benchmark</a>
      </div>
    </details>
  </aside>

  <div class="toolbar" role="toolbar" aria-label="Simulation and drawing tools">
    <button id="pause" type="button" aria-label="Pause" title="Pause"><span data-icon="pause"></span></button>
    <button id="resetFlow" type="button" aria-label="Reset flow" title="Reset flow"><span data-icon="rotate-ccw"></span></button>
    <span class="sep" aria-hidden="true"></span>
    <label class="tool" title="Draw obstacles"><input type="radio" name="tool" value="draw" checked aria-label="Draw" /><span data-icon="pencil"></span></label>
    <label class="tool" title="Erase obstacles"><input type="radio" name="tool" value="erase" aria-label="Erase" /><span data-icon="eraser"></span></label>
    <label class="tool" title="Probe the flow"><input type="radio" name="tool" value="probe" aria-label="Probe" /><span data-icon="crosshair"></span></label>
    <label class="brush" title="Brush size in cells"><output id="brushOut"></output><input id="brush" type="range" min="1" max="40" step="1" value="6" aria-label="Brush size" /></label>
  </div>

  <dl class="hud" id="stats" aria-live="off">
    <dt>C<sub>D</sub></dt><dd id="cd">–</dd>
    <dt>C<sub>L</sub></dt><dd id="cl">–</dd>
    <dt>Strouhal</dt><dd id="st">–</dd>
    <dt>Step</dt><dd id="step">0</dd>
    <dt>GPU</dt><dd id="mlups">–</dd>
    <dt>Probe</dt><dd id="probe">–</dd>
  </dl>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
